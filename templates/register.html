{% extends "base.html" %}
{% block title %}注册 · 英语词汇发音练习平台{% endblock %}

{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4 p-md-5">
    <h3 class="text-center mb-1">创建账号</h3>
    <p class="text-center text-muted mb-4">注册后即可保存练习结果与录音</p>

    {% if error %}
    <div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label class="form-label" for="username">用户名（3-32 位字母、数字、下划线或中文）</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username" required minlength="3"
                 maxlength="32" value="{{ username or '' }}" autocomplete="username">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="nickname">昵称（可选，仅显示用）</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-emoji-smile"></i></span>
          <input type="text" class="form-control" id="nickname" name="nickname" maxlength="32"
                 value="{{ nickname or '' }}" autocomplete="nickname">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">密码（至少 6 位）</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" required minlength="6"
                 autocomplete="new-password">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm">确认密码</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
          <input type="password" class="form-control" id="confirm" name="confirm" required autocomplete="new-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
        <i class="bi bi-person-plus me-2"></i>注 册
      </button>
      <div class="text-center text-muted small">
        已有账号？<a href="{{ url_for('login') }}" class="text-decoration-none">直接登录 →</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
