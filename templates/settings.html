{% extends "base.html" %}
{% block title %}设置 · 英语词汇发音练习平台{% endblock %}

{% block content %}
<div style="max-width:640px;margin:0 auto;">
  <div class="hero">
    <h1>练习设置</h1>
    <p class="mb-0 opacity-75">这些值是三个练习页的默认参数，开始时仍可临时改</p>
  </div>

  {% if message %}
  <div class="alert alert-success py-2"><i class="bi bi-check-circle-fill me-2"></i>{{ message }}</div>
  {% endif %}

  <div class="card shadow-sm">
    <form method="post" action="{{ url_for('settings') }}" class="card-body">
      <div class="mb-4">
        <label class="form-label" for="default_count">默认题量（1-100）</label>
        <input type="number" class="form-control" id="default_count" name="default_count"
               min="1" max="100" step="1" value="{{ user.default_count }}">
        <div class="form-text">看读译 / 听读写的默认抽词数量，设计文档建议 20。</div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="time_limit">近似音每题限时（秒，0.2-30）</label>
        <input type="number" class="form-control" id="time_limit" name="time_limit"
               min="0.2" max="30" step="0.1" value="{{ user.time_limit }}">
        <div class="form-text">按下 1 / 2 之前的可用时间，默认 1 秒。</div>
      </div>

      <div class="mb-4">
        <label class="form-label">近似音音频性别</label>
        <div class="btn-group d-flex" role="group">
          <input type="radio" class="btn-check" name="voice" id="voice_f" value="f"
                 {{ 'checked' if user.voice != 'm' }}>
          <label class="btn btn-outline-primary" for="voice_f">女声</label>
          <input type="radio" class="btn-check" name="voice" id="voice_m" value="m"
                 {{ 'checked' if user.voice == 'm' }}>
          <label class="btn btn-outline-primary" for="voice_m">男声</label>
        </div>
        <div class="form-text">对应 <code>static/audio/vowel/</code> 下 <code>*.f.wav</code> / <code>*.m.wav</code> 两套录音。</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="bi bi-save me-2"></i>保存设置
      </button>
    </form>
  </div>
</div>
{% endblock %}
