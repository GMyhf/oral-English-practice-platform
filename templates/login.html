{% extends "base.html" %}
{% block title %}登录 · 英语词汇发音练习平台{% endblock %}

{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4 p-md-5">
    <h3 class="text-center mb-1">登录</h3>
    <p class="text-center text-muted mb-4">登录后即可开始三种词汇发音练习</p>

    {% if error %}
    <div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
    {% endif %}

    <form method="post"
          action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') | urlencode }}{% endif %}">
      <div class="mb-3">
        <label class="form-label" for="username">用户名</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">密码</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>登 录
      </button>
      <div class="text-center text-muted small">
        还没有账号？<a href="{{ url_for('register') }}" class="text-decoration-none">立即注册 →</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
